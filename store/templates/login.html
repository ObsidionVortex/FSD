{% extends 'base.html' %}

{% block title %}Log In | Northstar{% endblock %}

{% block extra_head %}
<style>
    .auth-card {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        padding: clamp(28px, 5vw, 44px);
        max-width: 460px;
        margin: 32px auto;
        box-shadow: var(--shadow-md);
    }

    .auth-brand-badge {
        width: 44px;
        height: 44px;
        background: var(--primary-light);
        color: var(--primary);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        margin-bottom: 20px;
    }

    .auth-field {
        margin-bottom: 18px;
    }

    .auth-field label {
        display: block;
        font-size: 0.88rem;
        font-weight: 700;
        color: var(--ink);
        margin-bottom: 6px;
    }

    .auth-bottom-switch {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--line-light);
        text-align: center;
        font-size: 0.92rem;
        color: var(--muted);
    }

    .auth-demo-hint {
        margin-top: 20px;
        background: var(--canvas);
        border: 1px dashed var(--line);
        border-radius: var(--radius-md);
        padding: 12px 14px;
        font-size: 0.82rem;
        color: var(--muted);
    }
</style>
{% endblock %}

{% block content %}
    <div class="auth-card">
        <div class="auth-brand-badge">✦</div>
        <h1 class="page-heading" style="font-size: 1.8rem; margin-bottom: 6px;">Welcome back</h1>
        <p class="intro" style="font-size: 0.95rem; margin-bottom: 24px;">Log in to manage your orders and keep shopping.</p>

        <form method="post">
            {% csrf_token %}

            <div class="auth-field">
                <label for="id_username">Username</label>
                <input class="form-input" id="id_username" type="text" name="username" autocomplete="username" placeholder="Enter your username" required autofocus>
            </div>

            <div class="auth-field">
                <label for="id_password">Password</label>
                <input class="form-input" id="id_password" type="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            </div>

            <button class="button button-lg button-full" type="submit" style="margin-top: 8px;">
                Log in
            </button>
        </form>

        <div class="auth-bottom-switch">
            New here? <a href="{% url 'register' %}" style="font-weight: 700;">Create an account</a>
        </div>
    </div>
{% endblock %}
